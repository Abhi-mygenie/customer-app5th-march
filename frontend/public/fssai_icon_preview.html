<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FSSAI Icon Preview — BUG-2026-10-22-001</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px; }
  .card { background: white; border-radius: 12px; padding: 36px 48px; box-shadow: 0 2px 16px rgba(0,0,0,0.10); max-width: 520px; width: 100%; }
  h2 { font-size: 15px; color: #555; font-weight: 600; margin: 0 0 28px; letter-spacing: 0.04em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
  .icon-box { width: 28px; height: 28px; border: 2.5px solid; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-box.veg   { border-color: #00A651; }
  .icon-box.nonveg { border-color: #944A28; }

  /* VEG — green filled circle */
  .dot-veg {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #00A651;
  }

  /* NON-VEG / EGG — brown filled triangle (upward-pointing) */
  .dot-nonveg {
    width: 14px; height: 14px;
    background: #944A28;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    border-radius: 0;
  }

  .label { display: flex; flex-direction: column; gap: 3px; }
  .label strong { font-size: 15px; color: #222; }
  .label span   { font-size: 12px; color: #888; }

  hr { border: none; border-top: 1px solid #eee; margin: 8px 0 24px; }
  .note { font-size: 11px; color: #aaa; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h2>FSSAI Icon Preview — BUG-2026-10-22-001</h2>

  <div class="row">
    <div class="icon-box veg"><div class="dot-veg"></div></div>
    <div class="label">
      <strong>Vegetarian</strong>
      <span>Green filled circle · #00A651</span>
    </div>
  </div>

  <div class="row">
    <div class="icon-box nonveg"><div class="dot-nonveg"></div></div>
    <div class="label">
      <strong>Non-Vegetarian</strong>
      <span>Brown filled triangle · #944A28</span>
    </div>
  </div>

  <div class="row">
    <div class="icon-box nonveg"><div class="dot-nonveg"></div></div>
    <div class="label">
      <strong>Egg</strong>
      <span>Same as Non-Veg · Brown triangle · #944A28</span>
    </div>
  </div>

  <hr>
  <div class="note">Icons as they will appear after implementation of BUG-2026-10-22-001. Pending implementation gate approval.</div>
</div>
</body>
</html>
